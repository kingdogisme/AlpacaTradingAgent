[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.1.0"
description = "Auditable multi-agent trading research framework for paper trading, strategy testing, and risk-controlled execution"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "TradingAgents Team", email = "yijia.xiao@cs.ucla.edu"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Trading Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "typing-extensions",
    "langchain-openai>=0.3.32,<0.4.0",
    "langchain-core>=0.3.81,<1.0.0",
    "langchain-anthropic>=0.3.15,<0.4.0",
    "langchain-google-genai>=2.1.12,<3.0.0",
    "langchain-experimental>=0.3.4,<0.4.0",
    "pandas",
    "yfinance",
    "praw",
    "feedparser",
    "stockstats",
    "eodhd",
    "langgraph>=0.6.6,<0.7.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<3.0.0",
    "chromadb",
    "setuptools",
    "backtrader",
    "akshare",
    "tushare",
    "finnhub-python",
    "parsel",
    "requests",
    "tenacity",
    "tqdm",
    "pytz",
    "redis",
    "rich",
    "questionary",
    "python-dotenv",
    "gradio",
    "plotly",
    "dash>=3.0.0",
    "dash-bootstrap-components>=2.0.0",
    "flask>=3.0.0",
    "alpaca-py>=0.8.2",
]

[project.urls]
Homepage = "https://github.com/TauricResearch"

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "run_webui_dash:main"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "webui*"]

[tool.setuptools.package-data]
"tradingagents.prompts" = [
    "templates/*.md",
    "templates/*/*.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests/unit",
    "tests/integration/mocked",
]
pythonpath = [
    ".",
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "unit: deterministic unit tests with no external network or API calls",
    "integration: deterministic integration tests with mocked external boundaries",
    "mocked: tests that exercise end-to-end flows using local mocks only",
    "slow: local deterministic tests that are slower than the default suite",
    "external: smoke tests that require real external services and RUN_EXTERNAL_TESTS=1",
    "network: tests that intentionally open network sockets and RUN_EXTERNAL_TESTS=1",
]
filterwarnings = [
    "default",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning",
]
